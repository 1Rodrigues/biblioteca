{% extends 'base.html' %}

{% block title %}{% if autor.pk %}Editar autor{% else %}Cadastrar autor{% endif %}{% endblock %}

{% block content %}
    <h1>{% if autor.pk %}Editar autor{% else %}Cadastrar autor{% endif %}</h1>

    <form action="" method="post">
        {% csrf_token %}
        {{ form }}
        <div class="acoes">
            <button type="submit">{% if autor.pk %}Salvar{% else %}Cadastrar{% endif %}</button>
            <a class="btn btn-light" href="{% if autor.pk %}{% url 'author_detail' autor.pk %}{% else %}{% url 'listar_livros' %}{% endif %}">Cancelar</a>
        </div>
    </form>
{% endblock %}
