<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;600;700&display=swap" rel="stylesheet">
    <title>{% if livro %}Editar livro{% else %}Novo livro{% endif %}</title>
    <style>

        body {
            max-width: 980px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
            font-family: "Google Sans Flex", Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 2.5rem;
            letter-spacing: -0.02em;
            font-weight: 600;
        }
        form {
            background-color: #fff;
            padding: 1.5rem;
            border-radius: 1rem
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        input[type=text],
        input[type=number],
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 0.75rem 1rem;
            border: 0;
            border-radius: 0.75rem;
            background: #f5f5f7;
            font: inherit;
        }
        input[type=checkbox] {
            accent-color: #1d1d1f;
        }
        button {
            padding: 0.5rem 1rem;
            border: 0;
            border-radius: 999px;
            background: #1d1d1f;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
        button:hover {
            background: #424245;
        }
        svg {
            width: 24px;
        }
        h1 a {
            all: unset
        }
        svg:hover {
            opacity: 50%;
            cursor: pointer
        }
    </style>
</head>
<body>
    <h1>
        <a href="/">
            <svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.88 122.88"><defs><style>.cls-1{fill-rule:evenodd;}</style></defs><title>back</title><path class="cls-1" d="M61.44,0A61.51,61.51,0,1,1,18,18,61.25,61.25,0,0,1,61.44,0Zm5,45.27A7.23,7.23,0,1,0,56.14,35.13L35,56.57a7.24,7.24,0,0,0,0,10.15l20.71,21A7.23,7.23,0,1,0,66.06,77.62l-8.73-8.87,24.86-.15a7.24,7.24,0,1,0-.13-14.47l-24.44.14,8.84-9Z"/></svg>
        </a>
        {% if livro %}Editar livro{% else %}Novo livro{% endif %}
    </h1>
    <form method='POST'>
      {% csrf_token %}
      {% for field in form %}
          <div class="form-group" style="margin-bottom: 15px;">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}

            {% if field.errors %}
              <div class="error-message" style="color: red; font-size: 0.9rem;">
                {{ field.errors|striptags }}
              </div>
            {% endif %}
          </div>
        {% endfor %}
      <button type="submit">{% if livro %}Salvar alterações{% else %}Cadastrar livro{% endif %}</button>
    </form>
</body>
</html>
