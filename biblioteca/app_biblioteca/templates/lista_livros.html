<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Livros</title>

    <style>
        .indisponivel {
            color: #757575;
            text-decoration: line-through;
        }
    </style>

</head>
<body>
    <h1>Lista de Livros</h1>

    <ul>
        {% for livro in lista_de_livros %}
            <li class="{% if livro.disponivel %}disponivel{% else %}indisponivel{% endif %}">
                {{ livro.titulo }} - <span><a href="{% url 'author_detail' livro.autor.id %}">{{ livro.autor }}</a></span> {{ livro.ano_publicacao }} - {% if livro.disponivel %}disponivel{% else %}indisponivel{% endif %}
            </li>
        {% empty %}
            <li>Nenhum livro cadastrado.</li>
        {% endfor %}
    </ul>
</body>
</html>
