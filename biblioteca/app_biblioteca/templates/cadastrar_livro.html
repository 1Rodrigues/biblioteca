{% extends 'base.html' %}

{% block title %}{% if livro.pk %}Editar livro{% else %}Novo livro{% endif %}{% endblock %}

{% block content %}
    <h1>{% if livro.pk %}Editar livro{% else %}Novo livro{% endif %}</h1>

    <form action="" method="post">
        {% csrf_token %}
        {{ form }}
        <div class="acoes">
            <button type="submit">{% if livro.pk %}Salvar{% else %}Cadastrar{% endif %}</button>
            <a class="btn btn-light" href="{% url 'listar_livros' %}">Cancelar</a>
        </div>
    </form>
{% endblock %}
