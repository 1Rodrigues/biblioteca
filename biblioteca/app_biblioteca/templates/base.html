<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #222;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        header nav {
            max-width: 760px;
            margin: 0 auto;
            padding: 14px 16px;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        header .logo {
            font-weight: 700;
            color: var(--text);
            margin-right: auto;
        }
        main {
            max-width: 760px;
            margin: 32px auto;
            padding: 0 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
        }
        h1 { margin: 0 0 20px; font-size: 1.6rem; }
        h2 { margin: 0 0 8px; font-size: 1.25rem; }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .muted { color: var(--muted); }

        /* listas */
        ul.lista { list-style: none; padding: 0; margin: 0; }
        ul.lista li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        ul.lista li:last-child { border-bottom: none; }
        .indisponivel .titulo { color: var(--muted); text-decoration: line-through; }
        .badge {
            font-size: .75rem;
            padding: 2px 8px;
            border-radius: 999px;
            background: #dcfce7;
            color: #166534;
            white-space: nowrap;
        }
        .indisponivel .badge { background: #f3f4f6; color: var(--muted); }

        /* botões */
        .btn, button {
            display: inline-block;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
        .btn:hover, button:hover { background: var(--primary-hover); text-decoration: none; }
        .btn-light { background: #eef2ff; color: var(--primary); }
        .btn-light:hover { background: #e0e7ff; }
        .acoes { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

        /* formulários */
        form > div { margin-bottom: 16px; }
        form label { display: block; font-weight: 500; margin-bottom: 4px; }
        form input[type=text], form input[type=number], form select, form textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font: inherit;
            background: #fff;
        }
        form input:focus, form select:focus, form textarea:focus {
            outline: 2px solid #bfdbfe;
            border-color: var(--primary);
        }
        form input[type=checkbox] { margin-right: 6px; }
        form div div label { font-weight: 400; display: flex; align-items: center; }
        .errorlist { color: var(--danger); list-style: none; padding: 0; margin: 4px 0; font-size: .9rem; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="{% url 'listar_livros' %}">📚 Biblioteca</a>
            <a href="{% url 'cadastrar_livro' %}">Novo livro</a>
            <a href="{% url 'cadastrar_autor' %}">Novo autor</a>
        </nav>
    </header>
    <main>
        <div class="card">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
