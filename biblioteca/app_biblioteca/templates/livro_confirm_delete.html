{% extends 'base.html' %}

{% block title %}Excluir livro{% endblock %}

{% block content %}
    <h1>Excluir livro</h1>

    <p>Deseja realmente excluir o livro <strong>{{ livro.titulo }}</strong>?</p>

    <form action="" method="post">
        {% csrf_token %}
        <div class="acoes">
            <button style = 'background-color: red' type="submit">Excluir</button>
            <a class="btn btn-light" href="{% url 'listar_livros' %}">Cancelar</a>
        </div>
    </form>
{% endblock %}
