<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Excluir Livro</title>
    <style>

        body {
            max-width: 980px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
            font-family: "Google Sans Flex", Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 2.5rem;
            letter-spacing: -0.02em;
            font-weight: 600;
        }
        svg {
            width: 24px;
        }
        h1 a {
            all: unset
        }
        svg:hover {
            opacity: 50%;
            cursor: pointer
        }
        form {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: #fff;
            padding: 1.5rem;
            border-radius: 1rem;
        }
        p {
            margin: 0;
            flex: 1;
        }
        button {
            padding: 0.5rem 1rem;
            border: 0;
            border-radius: 999px;
            background: #1d1d1f;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
        button:hover {
            background: #424245;
        }
        form a {
            color: #6e6e73;
            text-decoration: none;
        }
        form a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>
        <a href="/">
            <svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.88 122.88"><defs><style>.cls-1{fill-rule:evenodd;}</style></defs><title>back</title><path class="cls-1" d="M61.44,0A61.51,61.51,0,1,1,18,18,61.25,61.25,0,0,1,61.44,0Zm5,45.27A7.23,7.23,0,1,0,56.14,35.13L35,56.57a7.24,7.24,0,0,0,0,10.15l20.71,21A7.23,7.23,0,1,0,66.06,77.62l-8.73-8.87,24.86-.15a7.24,7.24,0,1,0-.13-14.47l-24.44.14,8.84-9Z"/></svg>
        </a>
        Excluir livro
    </h1>
    <form action="" method="post">
        {% csrf_token %}
        <p>Excluir "{{ livro.titulo }}"?</p>
        <a href="{% url 'livro_detail' livro.pk %}">Cancelar</a>
        <button type="submit">Confirmar</button>
    </form>
</body>
</html>
